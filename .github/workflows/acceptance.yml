# 持續整合（Continuous Integration，CI）：每次開合併請求（PR）或推到 main，
# GitHub 會在自己的機器上重跑一次 Gherkin 驗收。通過才會亮綠色勾勾。
# docs/features/ 裡沒有情境時，直接算通過。
name: 自動驗收

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gherkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 檢查有沒有驗收情境
        id: has
        run: |
          if ls docs/features/*.feature docs/features/*.md 2>/dev/null | grep -qiv 'readme.md$'; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; echo "還沒有 Gherkin 情境，直接通過。" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: 安裝瀏覽器測試工具
        if: steps.has.outputs.yes == 'true'
        timeout-minutes: 6
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: 跑 Gherkin 驗收
        if: steps.has.outputs.yes == 'true'
        timeout-minutes: 3
        run: node tests/gherkin/run.cjs
      - name: 附上驗收結果
        if: always()
        run: |
          if [ -f docs/features/results/latest.md ]; then cat docs/features/results/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
